<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f5f9"/><stop offset="1" stop-color="#d9e1ea"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9c3cf"/><stop offset=".5" stop-color="#8b97a6"/><stop offset="1" stop-color="#6d7885"/></linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#98a4b2"/><stop offset="1" stop-color="#5c6773"/></linearGradient>
  </defs>
  <rect width="400" height="270" fill="url(#bg)"/>
  <!-- brake disc large -->
  <g transform="translate(120 150)">
    <circle r="86" fill="url(#metal)"/><circle r="86" fill="none" stroke="#5b6672" stroke-width="3"/>
    <circle r="72" fill="none" stroke="#6f7b88" stroke-width="1.5"/>
    <circle r="46" fill="url(#metal2)"/>
    <circle r="20" fill="#4d5763"/><circle r="9" fill="#2f3842"/>
    <g fill="#5c6773"><circle cx="0" cy="-33" r="5.5"/><circle cx="31" cy="-10" r="5.5"/><circle cx="19" cy="27" r="5.5"/><circle cx="-19" cy="27" r="5.5"/><circle cx="-31" cy="-10" r="5.5"/></g>
    <g stroke="#727e8b" stroke-width="2" opacity=".7">
      <circle r="80" fill="none" stroke-dasharray="6 9"/><circle r="60" fill="none" stroke-dasharray="6 9"/>
    </g>
  </g>
  <!-- brake disc small back -->
  <g transform="translate(268 96)" opacity=".95">
    <circle r="52" fill="url(#metal2)"/><circle r="52" fill="none" stroke="#4f5a66" stroke-width="2.5"/>
    <circle r="26" fill="#6b7683"/><circle r="11" fill="#3a434e"/>
    <g fill="#4f5a66"><circle cx="0" cy="-18" r="3.5"/><circle cx="17" cy="-6" r="3.5"/><circle cx="11" cy="15" r="3.5"/><circle cx="-11" cy="15" r="3.5"/><circle cx="-17" cy="-6" r="3.5"/></g>
  </g>
  <!-- oil filter -->
  <g transform="translate(300 195)">
    <rect x="-30" y="-42" width="60" height="84" rx="8" fill="#2d5f9c"/>
    <rect x="-30" y="-42" width="60" height="84" rx="8" fill="none" stroke="#1e4372" stroke-width="2"/>
    <rect x="-30" y="-16" width="60" height="26" fill="#f5f7fa" opacity=".9"/>
    <rect x="-30" y="-8" width="60" height="4" fill="#e0523f"/>
    <ellipse cx="0" cy="-42" rx="30" ry="8" fill="#7fa4cd"/>
  </g>
  <!-- spark plug -->
  <g transform="translate(52 66) rotate(-24)">
    <rect x="-9" y="-40" width="18" height="42" rx="4" fill="#e8ecf1"/>
    <rect x="-11" y="2" width="22" height="16" fill="#9aa6b3"/>
    <rect x="-6" y="18" width="12" height="20" fill="#b6c1cd"/>
    <rect x="-3" y="38" width="6" height="8" fill="#8b97a6"/>
  </g>
</svg>
