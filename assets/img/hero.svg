<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f38"/>
      <stop offset="45%" stop-color="#1b4470"/>
      <stop offset="72%" stop-color="#3f6d9c"/>
      <stop offset="100%" stop-color="#8fb0cd"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd89a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffb04f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f9dbd" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#2c4d75" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="tower2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f80a5" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#22405f" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ea6c8"/>
      <stop offset="100%" stop-color="#33587e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b586a"/>
      <stop offset="100%" stop-color="#232c39"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="720" fill="url(#sky)"/>
  <ellipse cx="1180" cy="430" rx="520" ry="260" fill="url(#sun)"/>

  <!-- far skyline -->
  <g fill="url(#tower2)" opacity=".55">
    <rect x="60" y="330" width="34" height="200"/>
    <rect x="104" y="380" width="26" height="150"/>
    <rect x="300" y="360" width="30" height="170"/>
    <rect x="340" y="400" width="22" height="130"/>
    <rect x="1380" y="370" width="34" height="160"/>
    <rect x="1424" y="410" width="26" height="120"/>
    <rect x="1465" y="390" width="30" height="140"/>
  </g>

  <!-- burj-like tower -->
  <g fill="url(#tower)">
    <path d="M150 530 L162 210 L168 90 L172 60 L176 90 L182 210 L194 530 Z"/>
    <path d="M126 530 L140 300 L150 300 L158 530 Z" opacity=".8"/>
    <path d="M186 530 L194 300 L204 300 L218 530 Z" opacity=".8"/>
  </g>
  <g fill="url(#tower)" opacity=".9">
    <rect x="232" y="300" width="46" height="230"/>
    <rect x="286" y="350" width="34" height="180"/>
    <rect x="1290" y="320" width="52" height="210"/>
    <rect x="1250" y="380" width="34" height="150"/>
  </g>
  <!-- windows -->
  <g fill="#ffd89a" opacity=".35">
    <rect x="238" y="316" width="6" height="9"/><rect x="250" y="316" width="6" height="9"/><rect x="262" y="316" width="6" height="9"/>
    <rect x="238" y="336" width="6" height="9"/><rect x="262" y="336" width="6" height="9"/>
    <rect x="238" y="356" width="6" height="9"/><rect x="250" y="356" width="6" height="9"/>
    <rect x="1296" y="340" width="6" height="9"/><rect x="1310" y="340" width="6" height="9"/><rect x="1326" y="340" width="6" height="9"/>
    <rect x="1296" y="362" width="6" height="9"/><rect x="1326" y="362" width="6" height="9"/>
  </g>

  <!-- sea -->
  <rect x="0" y="500" width="1600" height="120" fill="url(#sea)"/>
  <g stroke="#bcd6ea" stroke-opacity=".35" stroke-width="2" fill="none">
    <path d="M0 528h180M240 528h300M700 528h240M1040 528h420"/>
    <path d="M80 552h240M420 552h180M900 552h300M1290 552h220"/>
    <path d="M0 578h300M380 578h260M760 578h180M1020 578h480"/>
  </g>

  <!-- cargo ship -->
  <g transform="translate(880 396)">
    <rect x="0" y="70" width="330" height="46" rx="6" fill="#1d3a5c"/>
    <path d="M0 116h330l-26 30H26z" fill="#152c48"/>
    <g fill="#e05a3a">
      <rect x="18" y="40" width="34" height="30"/><rect x="56" y="40" width="34" height="30"/>
      <rect x="94" y="40" width="34" height="30"/><rect x="132" y="40" width="34" height="30"/>
    </g>
    <g fill="#2f7fbf">
      <rect x="18" y="8" width="34" height="30"/><rect x="56" y="8" width="34" height="30"/>
      <rect x="94" y="8" width="34" height="30"/>
    </g>
    <g fill="#e0a02f">
      <rect x="132" y="8" width="34" height="30"/><rect x="170" y="40" width="34" height="30"/>
      <rect x="208" y="40" width="34" height="30"/>
    </g>
    <g fill="#4aa06a"><rect x="170" y="8" width="34" height="30"/><rect x="208" y="8" width="34" height="30"/></g>
    <rect x="256" y="22" width="56" height="48" fill="#dfe8f1"/>
    <rect x="262" y="30" width="44" height="12" fill="#3c5f85"/>
    <rect x="278" y="0" width="8" height="24" fill="#c9d6e3"/>
  </g>

  <!-- airplane -->
  <g transform="translate(760 120) rotate(-6)" fill="#eef4fa">
    <path d="M0 34 C60 18 200 12 330 16 c46 1 74 7 74 18 s-28 17-74 18 C200 56 60 50 0 34 Z"/>
    <path d="M150 22 L104 -46 l34 0 l86 66 Z" fill="#d8e5f1"/>
    <path d="M150 46 L104 112 l34 0 l86 -64 Z" fill="#c5d7e8"/>
    <path d="M356 20 L338 -22 l16 0 l30 40 Z" fill="#dfe9f3"/>
    <ellipse cx="404" cy="34" rx="14" ry="9" fill="#c9d9e8"/>
    <rect x="196" y="26" width="46" height="18" rx="9" fill="#2f5b88"/>
    <g fill="#f5a623"><rect x="60" y="30" width="230" height="4" rx="2"/></g>
  </g>

  <!-- road -->
  <path d="M0 620h1600v100H0z" fill="url(#road)"/>
  <path d="M0 612h1600v10H0z" fill="#5d6b7d"/>
  <g fill="#f0f3f7" opacity=".6">
    <rect x="40" y="672" width="70" height="6" rx="3"/><rect x="170" y="672" width="70" height="6" rx="3"/>
    <rect x="300" y="672" width="70" height="6" rx="3"/><rect x="430" y="672" width="70" height="6" rx="3"/>
    <rect x="560" y="672" width="70" height="6" rx="3"/><rect x="690" y="672" width="70" height="6" rx="3"/>
    <rect x="820" y="672" width="70" height="6" rx="3"/><rect x="950" y="672" width="70" height="6" rx="3"/>
    <rect x="1080" y="672" width="70" height="6" rx="3"/><rect x="1210" y="672" width="70" height="6" rx="3"/>
    <rect x="1340" y="672" width="70" height="6" rx="3"/><rect x="1470" y="672" width="70" height="6" rx="3"/>
  </g>

  <!-- truck 1 (white) -->
  <g transform="translate(900 508)">
    <rect x="120" y="0" width="230" height="86" rx="4" fill="#eef2f7"/>
    <rect x="126" y="8" width="218" height="10" fill="#d6dee8"/>
    <path d="M20 24h96v62H20a10 10 0 0 1-10-10V54z" fill="#e7ecf2"/>
    <path d="M28 32h58v22H24z" fill="#8fb4d6"/>
    <rect x="10" y="70" width="106" height="16" fill="#cbd5e0"/>
    <circle cx="52" cy="88" r="16" fill="#1e2733"/><circle cx="52" cy="88" r="7" fill="#7d8896"/>
    <circle cx="230" cy="88" r="16" fill="#1e2733"/><circle cx="230" cy="88" r="7" fill="#7d8896"/>
    <circle cx="278" cy="88" r="16" fill="#1e2733"/><circle cx="278" cy="88" r="7" fill="#7d8896"/>
    <rect x="150" y="34" width="120" height="8" rx="4" fill="#f5a623"/>
  </g>

  <!-- truck 2 (yellow) -->
  <g transform="translate(1230 520)">
    <rect x="110" y="6" width="200" height="74" rx="4" fill="#f2b134"/>
    <rect x="116" y="14" width="188" height="9" fill="#d99a1f"/>
    <path d="M18 26h88v54H18a9 9 0 0 1-9-9V52z" fill="#f7c65c"/>
    <path d="M26 34h52v20H22z" fill="#8fb4d6"/>
    <circle cx="46" cy="82" r="14" fill="#1e2733"/><circle cx="46" cy="82" r="6" fill="#7d8896"/>
    <circle cx="210" cy="82" r="14" fill="#1e2733"/><circle cx="210" cy="82" r="6" fill="#7d8896"/>
    <circle cx="252" cy="82" r="14" fill="#1e2733"/><circle cx="252" cy="82" r="6" fill="#7d8896"/>
  </g>

  <!-- haze -->
  <rect y="470" width="1600" height="70" fill="#8fb0cd" opacity=".18"/>
</svg>
